name: Bump Homebrew formula

# When a release is published here, recompute the tarball's sha256 and update
# the formula in jonobri/homebrew-tap. Can also be run by hand against any tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump to (e.g. v1.0.1)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: tag
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$tag" ]; then echo "no tag resolved" >&2; exit 1; fi
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"    >> "$GITHUB_OUTPUT"

      - name: Compute tarball sha256
        id: sha
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.tag.outputs.tag }}.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | awk '{print $1}')
          if [ -z "$sha" ]; then echo "failed to compute sha" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the tap (deploy key, write access)
        uses: actions/checkout@v4
        with:
          repository: jonobri/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Rewrite url + sha256 in the formula
        run: |
          f=tap/Formula/dexy.rb
          sed -i -E "s|^  url \".*\"|  url \"${{ steps.sha.outputs.url }}\"|"   "$f"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${{ steps.sha.outputs.sha }}\"|" "$f"
          echo "----- updated formula -----"
          cat "$f"

      - name: Commit and push to the tap
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date; nothing to push."
            exit 0
          fi
          git add Formula/dexy.rb
          git commit -m "dexy ${{ steps.tag.outputs.version }}: update url + sha256"
          git push
